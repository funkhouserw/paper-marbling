<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marbler</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage">
  <div id="transport">
    <button id="play" title="Space">Pause</button>
    <label data-info="speed">Speed
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="5">5×</option>
      </select>
    </label>
    <button id="finish">Finish now</button>
    <button id="undo" title="Cmd/Ctrl+Z">Undo last</button>
    <button id="redo" title="Shift+Cmd/Ctrl+Z" disabled>Redo</button>
    <button id="clear">Clear tank</button>
    <label class="toggle" data-info="simulator">Simulator <select id="simulator"></select></label>
    <label class="toggle" data-info="walls"><input id="walls" type="checkbox"> Hard edges</label>
    <label class="toggle" data-info="tile"><input id="tile" type="checkbox"> Repeating</label>
    <button id="tilePreview" hidden>See it repeat</button>
    <label class="toggle" data-info="toolsWait"><input id="toolsWait" type="checkbox" checked> Tools wait for ink to settle</label>
    <label class="toggle" data-info="queueMode">While paused
      <select id="queueMode">
        <option value="together">all at once</option>
        <option value="order">in order</option>
        <option value="settled">each after the last settles</option>
      </select>
    </label>
    <label class="toggle" id="queueGapLabel" title="Seconds between queued actions" hidden>gap <input id="queueGap" type="number" value="0.5" min="0" max="30" step="0.1"> s</label>
    <label class="toggle" data-info="lowFramerate"><input id="lowFramerate" type="checkbox"> Low framerate</label>
    <button id="pull" title="Lay a sheet across the tank and keep the print">Pull paper</button>
    <span id="stats"></span>
  </div>
  <div id="tankBar">
    <label data-info="viscosity">Viscosity (mm²/s)<input id="visc" type="number" value="1000" min="5" max="20000"></label>
    <label data-info="tankSize">Width (mm)<input id="tankW" type="number" value="1000" min="100" max="4000"></label>
    <label>Height (mm)<input id="tankH" type="number" value="700" min="100" max="4000"></label>
    <button id="applyTank">Apply (clears tank)</button>
    <label data-info="baseColour"><input id="useBath" type="checkbox"> Base colour<input id="bath" type="color" value="#f4efe2"></label>
  </div>
  <div id="wrap"><canvas id="tank"></canvas><canvas id="overlay"></canvas><span id="paused" hidden>Paused: press Space to play</span></div>
  <p id="hint"></p>
</main>

<aside>
  <details class="panel" data-panel="Tool" open>
    <summary>Tool</summary>
    <div id="tools"></div>
    <div id="params"></div>
    <button id="apply" hidden>Apply to whole tank</button>
  </details>

  <details class="panel" data-panel="Palette" open>
    <summary data-info="palette">Palette</summary>
    <select id="palette" aria-label="Palette"></select>
  </details>

  <details class="panel" data-panel="Assistant" open>
    <summary data-info="assistant">Assistant</summary>
    <div id="chatLog" aria-live="polite" hidden></div>
    <div class="row prompt">
      <input id="prompt" type="text" placeholder="Describe a pattern or a change…" aria-label="Message the assistant">
      <button id="mic" title="Speak the prompt" aria-label="Speak the prompt" hidden>🎤</button>
      <button id="generate">Send</button>
    </div>
    <button id="clearChat" hidden>Clear chat</button>
  </details>

  <details class="panel" data-panel="Script" open>
    <summary data-info="script">Script</summary>
    <select id="examples"></select>
    <textarea id="script" spellcheck="false" rows="14"></textarea>
    <div class="row">
      <button id="run">Run (clears tank)</button>
      <button id="capture">Copy session to script</button>
    </div>
    <pre id="error" hidden></pre>
  </details>

  <details class="panel" data-panel="Saved states" open>
    <summary data-info="savedStates">Saved states</summary>
    <button id="saveState" title="Keep the tank exactly as it is now, to come back to">Save state</button>
    <div id="saves"></div>
  </details>

  <details class="panel" data-panel="Bath" id="bathPanel" hidden open>
    <summary data-info="flowPreset">Moving bath</summary>
    <select id="flowPreset" aria-label="Moving bath preset">
      <option value="calm">Calm: ink stops soon after the tool</option>
      <option value="curling">Curling: long feathers and wobble</option>
      <option value="whorls">Whorls: wakes roll up into spirals</option>
      <option value="storm">Storm: chaos, needs a high point limit</option>
      <option value="custom">Custom</option>
    </select>
    <div class="grid">
      <label data-info="flowPush">Rake push<input id="flowPush" type="number" value="1" min="0" max="20" step="0.5"></label>
      <label data-info="flowFriction">Floor drag<input id="flowFriction" type="number" value="0.25" min="0" max="10" step="0.05"></label>
      <label data-info="flowCoast">Longest coast (s)<input id="flowCoast" type="number" value="25" min="1" max="600" step="5"></label>
      <label data-info="flowCell">Flow grid (mm)<input id="flowCell" type="number" value="7" min="1.5" max="20" step="0.5"></label>
    </div>
  </details>

  <details class="panel" data-panel="Detail">
    <summary>Detail</summary>
    <label class="block" data-info="pointLimit">Point limit
      <select id="detailPreset">
        <option value="400000">Standard: smooth live play</option>
        <option value="2000000">High</option>
        <option value="5000000">Very high</option>
        <option value="10000000">Extreme</option>
        <option value="custom">Custom</option>
      </select>
    </label>
    <input id="pointLimit" type="number" value="400000" min="50000" max="20000000" step="50000" aria-label="Point limit">
  </details>

  <details class="panel" data-panel="Paper">
    <summary>Paper</summary>
    <div class="swatches" id="tints"></div>
    <div id="pullOptions">
      <label data-info="imperfection">Imperfections <span class="value" id="imperfectionValue">50%</span>
        <input id="imperfection" type="range" min="0" max="100" step="5" value="50"></label>
    </div>
    <label class="check" data-info="clearAfter"><input id="clearAfter" type="checkbox"> Clear tank after pull</label>
    <label class="check" data-info="mirror"><input id="mirror" type="checkbox"> Mirror like a real print</label>
    <label class="check" data-info="autoSave"><input id="autoSave" type="checkbox" checked> Download PNG on each pull</label>
    <div id="gallery"></div>
  </details>

  <details class="panel" data-panel="Export">
    <summary data-info="exportButtons">Export</summary>
    <div class="row">
      <button id="png">PNG</button>
      <button id="svg">SVG</button>
      <button id="print" title="A slow, high-resolution picture of the tank on paper. Doesn't change the tank.">Print</button>
    </div>
    <label class="check" data-info="printPale"><input id="printPale" type="checkbox" checked> Thin ink looks paler</label>
    <label class="check" data-info="printTexture"><input id="printTexture" type="checkbox" checked> Rims and texture</label>
    <label class="block" data-info="printSoft">Soft edges <span class="value" id="printSoftValue">0</span>
      <input id="printSoft" type="range" min="0" max="100" step="1" value="0"></label>
    <progress id="printProgress" max="1" value="0" hidden></progress>
    <img id="printResult" alt="The last print" hidden>
  </details>
</aside>
<dialog id="viewer">
  <img id="viewerImg" alt="Pulled print">
  <div class="row">
    <button id="viewerSave">Save PNG</button>
    <button id="viewerDelete">Delete</button>
    <button id="viewerClose">Close</button>
  </div>
</dialog>
<script type="module" src="ui.js"></script>
</body>
</html>
